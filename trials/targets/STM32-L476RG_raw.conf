# Trial target STM32-L476RG_raw: the trials compiled by binaries/silica-compiler-STM32-L476RG_raw and run
# on an ST NUCLEO-L476RG over its on-board ST-LINK (programs are loaded into RAM through OpenOCD; nothing
# is written to flash). Read by trial_target.sh (see README.md in this directory).
# Paths are relative to the repository root; environment variables override the defaults.

TARGET_DESCRIPTION="ST NUCLEO-L476RG over ST-LINK (bare metal)"

# Board pack: runtime, image builder (tools/build_image.sh) and runner (tools/run_on_board.py).
TARGET_BOARD_DIR="compiler/src/emitter/STM32-L476RG_raw/board"

# Python with pyserial (the ESP-IDF Python environment has it). Override: BOARD_PYTHON.
TARGET_PYTHON="$HOME/.espressif/python_env/idf6.2_py3.14_env/bin/python"
# Modules the preflight imports with that Python (the ESP32 default is "esptool serial").
TARGET_PY_MODULES="serial"
# Programs the preflight looks for on PATH: the debug probe tools and the Arm toolchain.
TARGET_TOOLS="openocd st-info arm-none-eabi-nm arm-none-eabi-gcc"

# build_image.sh writes <name>.elf (what OpenOCD loads) and <name>.bin; the runner takes the .elf.
TARGET_IMAGE_EXT=elf

# The Nucleo's ST-LINK virtual COM port. Used when BOARD_PORT is not set and the path exists; otherwise
# the single /dev/cu.usbmodem* port. /dev/cu.usbserial* (the ESP32 board) is never a candidate here.
TARGET_PORT_DEFAULT=/dev/cu.usbmodem21103

# Assembly goldens <trial>.st_nucleo.ascomp (platforms.mk: silica_golden_name_for_target). gen_board_ascomp.sh
# writes them after a green board run; until they exist every trial reports "has no .st_nucleo.ascomp file"
# (run with BOARD_ASCOMP=off to compare output only).
TARGET_ASCOMP_PLATFORM="st_nucleo"
