# Trial target ESP32-S3_idf: the trials compiled by binaries/silica-compiler-ESP32-S3_raw and run on an
# ESP32-S3 board over USB as a guest of ESP-IDF (transport_ble_plan.md §2.1): ESP-IDF owns the chip and
# Silica's two schedulers are two FreeRTOS tasks. Read by trial_target.sh (see README.md in this directory).
# Paths are relative to the repository root; environment variables override the defaults.

TARGET_DESCRIPTION="ESP32-S3 board over USB (guest of ESP-IDF)"

# The compiler is the ESP32-S3_raw one: the guest is another board runtime under the same emitted code.
TARGET_COMPILER="ESP32-S3_raw"

# The program prints what it prints on ESP32-S3_raw: that target's <trial>.ESP32-S3_raw.scout goldens and
# its skip list apply here too, after this target's own (<trial>.ESP32-S3_idf.scout, ESP32-S3_idf.skip).
TARGET_GOLDENS="ESP32-S3_raw"

# Board pack: the guest's image builder (tools/build_image.sh: the ESP-IDF application of idf_app/ linked
# with the Silica runtime and the program) and runner (tools/run_on_board.py: flash, reset, capture).
# Needs ESP-IDF at IDF_PATH (default ~/esp/esp-idf-v6.2).
TARGET_BOARD_DIR="compiler/src/emitter/ESP32-S3_raw/board/guest"

# Python with esptool and pyserial (the ESP-IDF Python environment). Override: BOARD_PYTHON.
TARGET_PYTHON="$HOME/.espressif/python_env/idf6.2_py3.14_env/bin/python"

# The emitted assembly is ESP32-S3_raw's, so its assembly goldens are checked here as well.
TARGET_ASCOMP_PLATFORM="esp32_s3"

# The ESP32-S3 board's USB serial port on this Mac (see ESP32-S3_raw.conf).
TARGET_PORT_DEFAULT=/dev/cu.usbserial-10
