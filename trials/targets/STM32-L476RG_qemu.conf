# Trial target STM32-L476RG_qemu: the trials compiled by binaries/silica-compiler-STM32-L476RG_raw and run
# in QEMU's STM32L4x5 model (machine b-l475e-iot01a) instead of on the NUCLEO-L476RG: no board, no ST-LINK,
# no serial port. Read by trial_target.sh (see README.md in this directory, "The emulated Nucleo").
# Paths are relative to the repository root; environment variables override the defaults.

TARGET_DESCRIPTION="NUCLEO-L476RG emulated in QEMU (bare metal, no board)"

# The compiler is the STM32-L476RG_raw one: the emulated board runs the same emitted code, runtime and
# linker script (the runtime is assembled with BOARD_QEMU: compiler/src/emitter/STM32-L476RG_raw/board/qemu/).
TARGET_COMPILER="STM32-L476RG_raw"

# The program prints what it prints on the board: STM32-L476RG_raw's <trial>.STM32-L476RG_raw.scout goldens
# and its skip list apply here too, after this target's own (<trial>.STM32-L476RG_qemu.scout,
# STM32-L476RG_qemu.skip).
TARGET_GOLDENS="STM32-L476RG_raw"

# Board pack: tools/build_image.sh (the board's builder with BOARD_QEMU) and tools/run_on_board.py (boots
# the image in qemu-system-arm and reads USART2 over a local TCP socket).
TARGET_BOARD_DIR="compiler/src/emitter/STM32-L476RG_raw/board/qemu"

# The runner needs only the standard library: any Python 3. Override: BOARD_PYTHON.
TARGET_PYTHON="$(command -v python3 || echo /usr/bin/python3)"
TARGET_PY_MODULES="socket struct"
# Programs the preflight looks for on PATH: the emulator and the Arm toolchain.
TARGET_TOOLS="qemu-system-arm arm-none-eabi-gcc arm-none-eabi-nm"

TARGET_IMAGE_EXT=elf

# The emitted assembly is STM32-L476RG_raw's, so its assembly goldens (<trial>.st_nucleo.ascomp) are checked.
TARGET_ASCOMP_PLATFORM="st_nucleo"

# No serial port: the runner answers --list-ports with the pseudo port "qemu".
TARGET_PORT_DEFAULT=""

# Programs run in parallel, each in its own QEMU (board_suite.sh run slots; a board has one, the default).
# Override: BOARD_RUN_SLOTS. Timer trials measure wall time, so keep it below the core count.
TARGET_RUN_SLOTS=4
